<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOOL 的个人博客</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <!-- 顶部标题条 -->
    <header class="card header-card">
      <h1>这是我的个人博客</h1>
      <p class="muted">这里可以放网站标题、导航文字</p>
    </header>

    <!-- 主内容：左窄右宽 -->
    <div class="grid">
      <!-- 左侧：个人简介 -->
      <section class="card profile-card">
        <img class="avatar" src="avatar.jpg" alt="头像" />
        <h2>我的简介</h2>
        <p class="muted">您好，我是 SOOL。这是我的个人网页。</p>

        <h2 class="mt">个人说明</h2>
        <p class="muted">不求人生如初见，但求相看两不厌。</p>

        <h2 class="mt">联系方式</h2>
        <img class="qr" src="qr.png" alt="微信二维码" />
      </section>

      <!-- 右侧卡片堆 -->
      <div class="stack">
        <section class="card music-card">
          <!-- 左：播放列表（由 script.js 从歌曲配置自动渲染，也可手写 data-src） -->
          <ul class="playlist" id="playlist"></ul>

          <!-- 右：播放控制 -->
          <div class="player">
            <div class="cover" id="cover">♪</div>
            <div class="now">
              <span class="now-name" id="nowName">未选择歌曲</span>
              <span class="now-artist" id="nowArtist">—</span>
            </div>

            <!-- 进度条 + 时间 -->
            <div class="progress">
              <span class="t-cur" id="tCur">0:00</span>
              <input type="range" class="seek" id="seek" min="0" max="100" value="0" step="0.1" aria-label="播放进度" />
              <span class="t-dur" id="tDur">0:00</span>
            </div>

            <!-- 控制按钮 -->
            <div class="controls">
              <button class="ctrl" id="shuffleBtn" aria-label="随机播放" title="随机播放">
                <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M17 3h4v4h-2V6.41l-3.29 3.3-1.42-1.42L17.59 5H17V3ZM3 5h3.5c.53 0 1.04.21 1.41.59L17.41 15H17v2h4v-4h-2v1.59L9.59 5.17A.99.99 0 0 0 8.5 5H3v0Zm0 14h5.5c.53 0 1.04-.21 1.41-.59l1.88-1.88-1.42-1.42-1.46 1.47a.99.99 0 0 1-.7.29H3v2Zm14.59-.41L20 16.59V18h2v-4h-4v2h.59l-3.3 3.29a.99.99 0 0 1-.7.29H3v2h11.5c.53 0 1.04-.21 1.41-.59Z"/></svg>
              </button>
              <button class="ctrl" id="prevBtn" aria-label="上一首">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 6h2v12H6zM20 6v12l-9-6z"/></svg>
              </button>
              <button class="play-btn" id="playBtn" aria-label="播放">
                <svg class="i-play" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
              </button>
              <button class="ctrl" id="nextBtn" aria-label="下一首">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg>
              </button>
              <button class="ctrl" id="loopBtn" aria-label="循环播放" title="循环播放">
                <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H6a2 2 0 0 0-2 2v3h2V7Zm10 10H7v-3l-4 4 4 4v-3h11a2 2 0 0 0 2-2v-3h-2v3Z"/></svg>
              </button>
            </div>

            <!-- 音量 -->
            <div class="volume">
              <button class="ctrl vol-btn" id="muteBtn" aria-label="静音">
                <svg class="i-vol" viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg>
                <svg class="i-mute" viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3Zm18 .6L19.4 8 17 10.4 14.6 8 13 9.6 15.4 12 13 14.4 14.6 16 17 13.6 19.4 16 21 14.4 18.6 12 21 9.6Z"/></svg>
              </button>
              <input type="range" class="vol" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="音量" />
            </div>
          </div>
        </section>
        <section class="card">
          <h2>卡片 2</h2>
          <p class="muted">励志语录 / 其他内容</p>
        </section>
        <section class="card">
          <h2>卡片 3</h2>
          <p class="muted">备用内容区域</p>
        </section>
      </div>
    </div>

    <!-- 底部通栏 -->
    <footer class="card footer-card">
      <h2>底部通栏区域</h2>
      <p class="muted">版权信息、站点备注</p>
    </footer>
  </main>

  <!-- 真实音频播放器（隐藏，由 JS 控制） -->
  <audio id="audio" preload="metadata"></audio>

  <script src="script.js"></script>
</body>
</html>
